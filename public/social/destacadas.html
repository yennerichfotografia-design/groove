<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  .cover {
    width:1080px; height:1080px; background:#0a0a0a; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .cover::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(70% 70% at 50% 50%, rgba(238,158,3,0.08) 0%, transparent 60%);
  }
  .ic { width:520px; height:520px; position:relative; z-index:2; }
  .ic svg { width:520px; height:520px; display:block; }
  .i { fill:none; stroke:#EE9E03; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>

  <!-- 1. SERVICIOS — grid -->
  <div class="cover" data-document-role="page" data-label="Servicios">
    <div class="ic">
      <svg viewBox="0 0 24 24"><g class="i">
        <rect width="7" height="7" x="3" y="3" rx="1.5"/>
        <rect width="7" height="7" x="14" y="3" rx="1.5"/>
        <rect width="7" height="7" x="14" y="14" rx="1.5"/>
        <rect width="7" height="7" x="3" y="14" rx="1.5"/>
      </g></svg>
    </div>
  </div>

  <!-- 2. PROYECTOS — folder -->
  <div class="cover" data-document-role="page" data-label="Proyectos">
    <div class="ic">
      <svg viewBox="0 0 24 24"><g class="i">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
      </g></svg>
    </div>
  </div>

  <!-- 3. NOSOTROS — users -->
  <div class="cover" data-document-role="page" data-label="Nosotros">
    <div class="ic">
      <svg viewBox="0 0 24 24"><g class="i">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </g></svg>
    </div>
  </div>

  <!-- 4. MÉTODO — workflow -->
  <div class="cover" data-document-role="page" data-label="Método">
    <div class="ic">
      <svg viewBox="0 0 24 24"><g class="i">
        <rect width="8" height="8" x="3" y="3" rx="2"/>
        <path d="M7 11v4a2 2 0 0 0 2 2h4"/>
        <rect width="8" height="8" x="13" y="13" rx="2"/>
      </g></svg>
    </div>
  </div>

  <!-- 5. CONTACTO — chat -->
  <div class="cover" data-document-role="page" data-label="Contacto">
    <div class="ic">
      <svg viewBox="0 0 24 24"><g class="i">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>
      </g></svg>
    </div>
  </div>

</body>
</html>
