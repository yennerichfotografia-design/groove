<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  .cover {
    width:1080px; height:1080px; background:#0a0a0a; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Clash Display',sans-serif; overflow:hidden;
  }
  /* subtle radial vignette */
  .cover::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 40%, rgba(238,158,3,0.06) 0%, transparent 55%);
  }
  .ic { width:300px; height:300px; display:flex; align-items:center; justify-content:center; position:relative; z-index:2; }
  .ic svg { width:300px; height:300px; }
  .lbl {
    margin-top:60px; color:#f5f5f3; font-size:62px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; position:relative; z-index:2;
  }
  .star { position:absolute; top:70px; left:50%; transform:translateX(-50%); color:#EE9E03; font-size:54px; z-index:2; }
  .ring { position:absolute; inset:330px; border:2px solid rgba(245,245,243,0.08); border-radius:50%; z-index:1; }
  /* stroke icon style */
  .st { fill:none; stroke:#EE9E03; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
  .stw { fill:none; stroke:#f5f5f3; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>

  <!-- 1. SERVICIOS -->
  <div class="cover">
    <span class="star">✱</span>
    <div class="ring"></div>
    <div class="ic">
      <svg viewBox="0 0 100 100"><g class="st">
        <rect x="14" y="14" width="30" height="30" rx="4"/>
        <rect x="56" y="14" width="30" height="30" rx="4"/>
        <rect x="14" y="56" width="30" height="30" rx="4"/>
        <rect x="56" y="56" width="30" height="30" rx="4"/>
      </g></svg>
    </div>
    <div class="lbl">Servicios</div>
  </div>

  <!-- 2. PROYECTOS -->
  <div class="cover">
    <span class="star">✱</span>
    <div class="ring"></div>
    <div class="ic">
      <svg viewBox="0 0 100 100"><g class="st">
        <path d="M14 30 h20 l8 10 h36 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 H18 a4 4 0 0 1 -4 -4 V30 z"/>
        <path class="stw" d="M50 52 v18 M41 61 h18"/>
      </g></svg>
    </div>
    <div class="lbl">Proyectos</div>
  </div>

  <!-- 3. NOSOTROS -->
  <div class="cover">
    <span class="star">✱</span>
    <div class="ring"></div>
    <div class="ic">
      <svg viewBox="0 0 100 100"><g class="st">
        <circle cx="36" cy="40" r="12"/>
        <circle cx="64" cy="40" r="12"/>
        <path d="M18 80 a18 18 0 0 1 36 0"/>
        <path class="stw" d="M46 80 a18 18 0 0 1 36 0"/>
      </g></svg>
    </div>
    <div class="lbl">Nosotros</div>
  </div>

  <!-- 4. MÉTODO -->
  <div class="cover">
    <span class="star">✱</span>
    <div class="ring"></div>
    <div class="ic">
      <svg viewBox="0 0 100 100"><g class="st">
        <circle cx="24" cy="50" r="8"/>
        <circle cx="50" cy="50" r="8"/>
        <circle cx="76" cy="50" r="8"/>
        <path d="M32 50 h10 M58 50 h10"/>
      </g></svg>
    </div>
    <div class="lbl">Método</div>
  </div>

  <!-- 5. CONTACTO -->
  <div class="cover">
    <span class="star">✱</span>
    <div class="ring"></div>
    <div class="ic">
      <svg viewBox="0 0 100 100"><g class="st">
        <path d="M18 26 h64 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 H44 l-16 14 v-14 H18 a6 6 0 0 1 -6 -6 V32 a6 6 0 0 1 6 -6 z"/>
        <path class="stw" d="M34 46 h32 M34 56 h20"/>
      </g></svg>
    </div>
    <div class="lbl">Contacto</div>
  </div>

</body>
</html>
